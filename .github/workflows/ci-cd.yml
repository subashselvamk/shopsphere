name: ShopSphere CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/shopsphere

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies and test User Service
      run: |
        cd user-service
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
        # pytest test_user.py --cov=main --cov-report=xml
    
    - name: Install dependencies and test Product Service
      run: |
        cd product-service
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
        # pytest test_product.py --cov=main --cov-report=xml
    
    - name: Install dependencies and test Order Service
      run: |
        cd order-service
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
        # pytest test_order.py --cov=main --cov-report=xml

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: [user-service, product-service, order-service, api-gateway]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Deploy to Kubernetes
      run: |
        # Create namespace if it doesn't exist
        kubectl apply -f k8s/namespace.yaml
        
        # Deploy MongoDB
        kubectl apply -f k8s/mongodb/
        
        # Wait for MongoDB to be ready
        kubectl wait --for=condition=ready pod -l app=mongo -n shopsphere --timeout=300s
        
        # Deploy microservices
        kubectl apply -f k8s/user-service/
        kubectl apply -f k8s/product-service/
        kubectl apply -f k8s/order-service/
        kubectl apply -f k8s/api-gateway/
        
        # Wait for deployments to be ready
        kubectl wait --for=condition=available deployment --all -n shopsphere --timeout=300s
        
        # Restart deployments to pull latest images
        kubectl rollout restart deployment -n shopsphere
        kubectl rollout status deployment -n shopsphere --timeout=300s
    
    - name: Verify deployment
      run: |
        kubectl get all -n shopsphere
        kubectl get pods -n shopsphere
    
    - name: Run smoke tests
      run: |
        # Get the gateway service endpoint
        GATEWAY_IP=$(kubectl get svc api-gateway -n shopsphere -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Gateway IP: $GATEWAY_IP"
        
        # Test health endpoint
        # curl -f http://$GATEWAY_IP/health || exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()
    
    steps:
    - name: Deployment Success
      if: ${{ needs.deploy.result == 'success' }}
      run: echo "✅ ShopSphere deployed successfully to Kubernetes!"
    
    - name: Deployment Failure
      if: ${{ needs.deploy.result == 'failure' }}
      run: echo "❌ ShopSphere deployment failed. Check logs for details."