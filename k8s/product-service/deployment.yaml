apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopsphere
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: ghcr.io/OWNER/shopsphere-product-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
          volumeMounts:
            - name: product-uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: product-uploads
          emptyDir: {}
